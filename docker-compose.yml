# SiteFlow-Pro — local dev stack
# Brings up MySQL 8 + the app image built from ./Dockerfile.
# Usage: docker compose up --build
#
# NOTE: this is for local dev only. Production uses RDS / managed MySQL.

services:
  mysql:
    image: mysql:8.4
    container_name: siteflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: siteflow
      MYSQL_USER: siteflow
      MYSQL_PASSWORD: siteflowpw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        BUILD_SHA: local
        BUILD_DATE: local
    image: siteflow-pro:local
    container_name: siteflow-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: mysql://siteflow:siteflowpw@mysql:3306/siteflow
      SESSION_SECRET: ${SESSION_SECRET:-devsecret-change-me}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mysql_data: